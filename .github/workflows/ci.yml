name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Generated files must match src/, all unit/schema/workflow/E2E-logic tests
      # must pass, and the secret scan must be clean. No dependencies are installed.
      - run: npm test
